[package]
name = "farmprint-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FarmPrint desktop command center for additive manufacturing print farms"

[lib]
name = "farmprint_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fp-core = { path = "../crates/fp-core" }
fp-mesh = { path = "../crates/fp-mesh" }
fp-sync = { path = "../crates/fp-sync", features = ["supabase", "keychain"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

# App lock (see src/applock.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSGeometry"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"
# Kitting card print: 4×6 paper on the native print panel (see print_current_window)
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSView", "NSWindow", "NSResponder", "NSGraphics", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Security_Credentials_UI", "Foundation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
