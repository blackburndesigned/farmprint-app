[workspace]
resolver = "2"
members = [
    "crates/fp-core",
    "crates/fp-mesh",
    "crates/fp-sync",
    "src-tauri",
]

[workspace.package]
version = "0.9.26"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
